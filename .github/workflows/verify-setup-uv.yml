name: Verify setup-uv for handbook
on:
  push:
    branches: [verify-setup-uv-20260914]
jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.12'
          enable-cache: true
          prune-cache: false
      - name: Verify installed uv and dependency execution
        run: |
          uv --version
          uv run --no-project --with idna==3.10 python -c "import idna; assert idna.__version__ == '3.10'; print('Dependency execution passed')"
